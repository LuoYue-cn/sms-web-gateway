# Terminate TLS at your existing reverse proxy and forward X-Forwarded-Proto/-For to this container.
# See DEPLOYMENT.md for an HTTPS example.

map $http_x_forwarded_proto $smsgate_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/server/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $smsgate_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        # The direct peer address, never a client-supplied header, so login throttling cannot be
        # evaded by spoofing X-Forwarded-For. Behind a reverse proxy this is the proxy's address.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        # Long-poll (<= 25 s) and SSE (~55 s) must not be buffered or cut short.
        fastcgi_buffering off;
        fastcgi_read_timeout 90s;
        fastcgi_send_timeout 90s;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
