# ----------------------------------------------------
# SMS Web Gateway — 宝塔 Nginx 伪静态配置
# 请在宝塔面板：网站设置 -> 伪静态 中粘贴以下内容并保存
# ----------------------------------------------------

location /api/ {
    try_files $uri $uri/ /index.php$is_args$args;
}

location / {
    try_files $uri $uri/ /index.html /index.php$is_args$args;
}

# 静态资源缓存（由前端构建工具自动生成哈希版本号）
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 关于实时推送（SSE）：服务端会对 /api/v1/events 发送 `X-Accel-Buffering: no`，Nginx 据此不缓冲，无需额外配置。
# 只有当你在它前面又套了别的反向代理（CDN / 另一层 Nginx / 云厂商网关）并且它缓冲了响应时，网页才会收不到实时推送。
# 那一层需要关闭缓冲：Nginx 用 `proxy_buffering off;`，Cloudflare 等需关闭对该路径的缓冲/缓存。详见 TROUBLESHOOTING.md。

# 禁止外部直接访问后端核心代码、数据库与数据目录
location ~ ^/(data|migrations|src|bin|\.git|\.env|install\.lock) {
    deny all;
    return 404;
}
